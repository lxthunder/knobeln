<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knobeln – Datenbank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen active">
    <h1>KNOBELN</h1>
    <h2>Spieler-Datenbank</h2>
    <table class="db-table" id="dbTable">
      <thead><tr><th>Name</th><th>Geburtstag</th><th>Lieblingsgetränk</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="db-form">
      <input class="input-underline" id="dbName" placeholder="Name" maxlength="40">
      <input class="input-underline" id="dbBirthday" placeholder="Geburtstag" maxlength="20">
      <input class="input-underline" id="dbDrink" placeholder="Lieblingsgetränk" maxlength="40">
      <div class="checkbox-wrap">
        <input type="checkbox" id="dbAddCheckbox" onchange="onDbAddCheckbox()">
        <label for="dbAddCheckbox">Hinzufügen</label>
      </div>
    </div>
  </div>

  <script>
    async function loadDB() {
      const res = await fetch('/api/knobel');
      const entries = await res.json();
      const tbody = document.querySelector('#dbTable tbody');
      tbody.innerHTML = '';
      entries.forEach((e, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${e.name}</td><td>${e.geburtstag}</td><td>${e.lieblingsgetraenk}</td>`
          + `<td><button class="btn-link" onclick="deleteEntry(${i})">✕</button></td>`;
        tbody.appendChild(tr);
      });
    }

    async function deleteEntry(i) {
      await fetch(`/api/knobel/${i}`, { method: 'DELETE' });
      await loadDB();
    }

    async function onDbAddCheckbox() {
      const cb = document.getElementById('dbAddCheckbox');
      if (!cb.checked) return;
      const name = document.getElementById('dbName').value.trim();
      const geburtstag = document.getElementById('dbBirthday').value.trim();
      const lieblingsgetraenk = document.getElementById('dbDrink').value.trim();
      if (!name) { cb.checked = false; return; }
      await fetch('/api/knobel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, geburtstag, lieblingsgetraenk }),
      });
      document.getElementById('dbName').value = '';
      document.getElementById('dbBirthday').value = '';
      document.getElementById('dbDrink').value = '';
      cb.checked = false;
      await loadDB();
    }

    loadDB();
  </script>
</body>
</html>
