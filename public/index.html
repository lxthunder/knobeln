<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knobeln</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="style.css">
  <style>
    .screen { display: none; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 520px; padding: 24px; }
    .screen.active { display: flex; }

    .name-input { width: 240px; font-size: 26px; color: #fff; }
    .player-count { font-size: 13px; color: #555; }
    .waiting-msg { font-size: 14px; color: #555; letter-spacing: 1px; }

    /* Loading */
    .coin-checkbox-row { display: flex; align-items: center; gap: 20px; }
    .checkbox-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .checkbox-wrap label { font-size: 12px; color: #555; letter-spacing: 1px; text-transform: uppercase; }
    #lockCheckbox, #guessCheckbox, #joinCheckbox, #startCheckbox {
      width: 28px; height: 28px; cursor: pointer;
      accent-color: #ff8c00;
    }
    #lockCheckbox:disabled, #guessCheckbox:disabled { cursor: default; opacity: 0.4; }

    .check-count { font-size: 13px; color: #555; }
    .spectator-banner { font-size: 13px; color: #555; letter-spacing: 2px; text-transform: uppercase; padding: 8px 16px; border: 1px solid #333; }

    /* Guessing */
    .whose-turn { font-size: 15px; color: #aaa; }
    .whose-turn span { color: #ff8c00; font-weight: bold; }
    #guessInput {
      width: 100px; font-size: 42px; font-weight: bold; color: #fff;
      background: transparent; border: none; border-bottom: 3px solid #ff8c00;
      outline: none; text-align: center; padding: 4px 0;
      -moz-appearance: textfield;
    }
    #guessInput::-webkit-outer-spin-button,
    #guessInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #guessInput:disabled { border-bottom-color: #333; color: #333; }
    .guess-row { display: flex; align-items: center; gap: 12px; }
    .guess-adj-btn {
      width: 44px; height: 44px; font-size: 28px; line-height: 1;
      background: transparent; border: 1px solid #444; color: #fff;
      cursor: pointer; user-select: none;
      -webkit-appearance: none; border-radius: 0;
    }
    .guess-adj-btn:disabled { border-color: #222; color: #333; cursor: default; }
    .guess-history { list-style: none; display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 280px; }
    .guess-history li { font-size: 14px; color: #555; display: flex; gap: 8px; }
    .guess-history li .g-name { flex: 1; }
    .guess-history li .g-val { color: #ff8c00; font-weight: bold; }
    .turn-order { list-style: none; display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 280px; }
    .turn-order li { font-size: 13px; color: #fff; padding: 4px 8px; }
    .turn-order li.active-turn { color: #ff8c00; border-left: 2px solid #ff8c00; padding-left: 10px; }
    .turn-order li.done { color: #27ae60; text-decoration: none; }
    .turn-order li.spectator-turn { color: #333; font-style: italic; }
    .turn-order li .g-val { color: #fff; font-weight: bold; margin-left: 6px; }

    /* Reveal */
    #screen-reveal { align-items: center; }
    .reveal-coins-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      width: 320px;
      max-width: 100%;
    }
    .reveal-coin {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      opacity: 0; transform: scale(0.5);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .reveal-coin.visible { opacity: 1; transform: scale(1); }
    .reveal-coin img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .reveal-total-area { align-self: center; display: flex; flex-direction: column; align-items: center; margin-top: 16px; }
    .reveal-total-label { color: #888; font-size: 13px; letter-spacing: 2px; margin-bottom: 6px; }
    .total-coins-big { font-size: 72px; font-weight: bold; color: #ffffff; line-height: 1; }
    .counter-bump { animation: bump 0.25s ease; }
    @keyframes bump { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }

    /* Finished */
    .loser-name-big { font-size: 52px; font-weight: bold; color: #c0392b; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="screen-login" class="screen active">
    <h1>KNOBELN</h1>
    <input id="nameInput" class="input-underline name-input" type="text" placeholder="Player" maxlength="20" autocomplete="off">
    <div class="checkbox-wrap">
      <input type="checkbox" id="joinCheckbox" onchange="onJoinCheckboxChange()">
      <label for="joinCheckbox">Bereit</label>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="screen-lobby" class="screen">
    <h1>KNOBELN</h1>
    <h2>Lobby</h2>
    <ul id="playerList" class="player-list"></ul>
    <div class="checkbox-wrap" id="startBtnWrap" style="display:none">
      <input type="checkbox" id="startCheckbox" onchange="onStartCheckboxChange()">
      <label for="startCheckbox">Bereit</label>
    </div>
  </div>

  <!-- SPECTATOR WAIT -->
  <div id="screen-spectator" class="screen">
    <h1>KNOBELN</h1>
    <div class="spectator-banner">Spiel im Gange</div>
  </div>

  <!-- LOADING: Münzen wählen + Checkbox -->
  <div id="screen-loading" class="screen">
    <h1>LADEN</h1>
    <div id="roundBadgeLoading" class="round-badge" style="display:none"></div>
    <div class="checkbox-wrap">
      <input type="checkbox" id="lockCheckbox" onchange="onCheckboxChange()">
      <label for="lockCheckbox">Bereit</label>
    </div>
    <p id="loadingHint" style="color:#aaa;font-size:14px;">Wähle deine Münzen und bestätige</p>

    <div class="coins-row" id="loadingCoins">
      <div class="coin-wrapper" onclick="toggleCoin(0)"><div class="coin"><img src="coin.png" alt="coin"></div></div>
      <div class="coin-wrapper" onclick="toggleCoin(1)"><div class="coin"><img src="coin.png" alt="coin"></div></div>
      <div class="coin-wrapper" onclick="toggleCoin(2)"><div class="coin"><img src="coin.png" alt="coin"></div></div>
    </div>

    <div id="spectatorBanner" class="spectator-banner" style="display:none">Du schaust zu</div>
    <ul id="checkList" class="player-list"></ul>
    <div class="check-count" id="checkCount"></div>
  </div>

  <!-- GUESSING: Reihum tippen -->
  <div id="screen-guessing" class="screen">
    <h1>TIPPEN</h1>
    <div id="roundBadgeGuessing" class="round-badge" style="display:none"></div>
    <div class="checkbox-wrap" id="guessBtnWrap">
      <input type="checkbox" id="guessCheckbox" onchange="onGuessCheckboxChange()" disabled>
      <label for="guessCheckbox">Bereit</label>
    </div>
    <div class="coins-row" id="guessingCoins">
      <div class="coin-wrapper readonly"><div class="coin"><img src="coin.png" alt="coin"></div></div>
      <div class="coin-wrapper readonly"><div class="coin"><img src="coin.png" alt="coin"></div></div>
      <div class="coin-wrapper readonly"><div class="coin"><img src="coin.png" alt="coin"></div></div>
    </div>
    <div class="whose-turn" id="whoseTurn">Warte...</div>
    <div class="guess-row" id="guessRow">
      <button class="guess-adj-btn" id="guessDown" onclick="adjustGuess(-1)" disabled>−</button>
      <input id="guessInput" type="number" min="0" max="99" placeholder="?" disabled>
      <button class="guess-adj-btn" id="guessUp" onclick="adjustGuess(1)" disabled>+</button>
    </div>
    <ul class="player-list" id="turnOrder"></ul>
  </div>

  <!-- REVEAL -->
  <div id="screen-reveal" class="screen">
    <h1>ERGEBNIS</h1>
    <div class="reveal-coins-grid" id="revealCoinsGrid"></div>
    <div class="reveal-total-area">
      <div class="reveal-total-label">GESAMT</div>
      <div class="total-coins-big" id="totalCoins">0</div>
    </div>
    <ul class="player-list" id="revealTurnOrder"></ul>
    <div id="revealCorrectMsg" style="display:none;align-self:center;text-align:center;font-size:15px;color:#27ae60;letter-spacing:1px;opacity:0;transition:opacity 0.4s ease;"></div>
  </div>

  <!-- FINISHED -->
  <div id="screen-finished" class="screen">
    <h1>KNOBELN</h1>
    <div class="status-msg">VERLIERER</div>
    <div class="loser-name-big" id="loserName">—</div>
    <ul class="player-list" id="finishedPlayerList"></ul>
    <div class="checkbox-wrap">
      <input type="checkbox" id="restartCheckbox" onchange="onRestartCheckbox()">
      <label for="restartCheckbox">O.K.</label>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ── Sounds ─────────────────────────────────────────────
    let audioCtx = null;
    function ctx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function play(freq, type, duration, startVol, endFreq) {
      const c = ctx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.connect(gain); gain.connect(c.destination);
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, c.currentTime);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, c.currentTime + duration);
      gain.gain.setValueAtTime(startVol || 0.25, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.start(c.currentTime); osc.stop(c.currentTime + duration);
    }
    const sounds = {
      coin: () => play(900, 'sine', 0.12, 0.2, 1300),
      total: () => {
        [523, 659, 784].forEach((f, i) => setTimeout(() => play(f, 'sine', 0.35, 0.18), i * 100));
      },
      correct: () => {
        [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => play(f, 'sine', 0.3, 0.2), i * 80));
      },
      loser: () => play(300, 'sawtooth', 0.9, 0.3, 80),
    };

    const socket = io();
    // ── Wake Lock ──────────────────────────────────────────
    let wakeLock = null;
    async function requestWakeLock() {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    requestWakeLock();

    let myId = null;
    let isHost = false;
    let coinStates = [true, true, true];
    let isChecked = false;
    let amSpectator = false;
    let hasJoined = false;
    let turnOrderData = [];
    let revealAnimationEndsAt = 0;
    let forbiddenNumber = null;

    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ── Login ──────────────────────────────────────────────
    socket.on('connect', () => { myId = socket.id; });

    document.getElementById('nameInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') { document.getElementById('joinCheckbox').checked = true; onJoinCheckboxChange(); }
    });

    function onJoinCheckboxChange() {
      const cb = document.getElementById('joinCheckbox');
      if (!cb.checked) return;
      const name = document.getElementById('nameInput').value.trim();
      if (!name) { cb.checked = false; return; }
      cb.disabled = true;
      join();
    }

    function join() {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) return;
      hasJoined = true;
      socket.emit('player:join', { name });
    }

    // ── Lobby ──────────────────────────────────────────────
    socket.on('lobby:update', ({ players, hostId, youngestId }) => {
      if (!hasJoined) return;
      const me = players.find(p => p.id === myId);
      if (me) amSpectator = me.isSpectator || false;
      if (amSpectator) { show('screen-spectator'); return; }
      show('screen-lobby');
      isHost = hostId === myId;

      const list = document.getElementById('playerList');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.textContent = p.name
          + (p.id === hostId ? ' 👑' : '')
          + (p.id === youngestId ? ' 🍼' : '');
        li.style.color = '#ffffff';
        list.appendChild(li);
      });

      const wrap = document.getElementById('startBtnWrap');
      const cb = document.getElementById('startCheckbox');
      wrap.style.display = isHost ? '' : 'none';
      cb.disabled = players.length < 2;
      cb.checked = false;
    });

    function onStartCheckboxChange() {
      const cb = document.getElementById('startCheckbox');
      if (!cb.checked) return;
      cb.disabled = true;
      socket.emit('host:startGame');
    }

    // ── Phase changes ──────────────────────────────────────
    socket.on('game:phaseChange', ({ phase, players, turnOrder, roundMode, currentRound, lastLoserId }) => {
      if (phase === 'loading') {
        const me = players?.find(p => p.id === myId);
        amSpectator = me?.isSpectator || false;

        // Rundenanzeige
        const roundLabel = roundMode
          ? (currentRound === 'final' ? 'ENDSPIEL' : `RUNDE ${currentRound} VON 2`)
          : null;
        const badgeEl = document.getElementById('roundBadgeLoading');
        badgeEl.style.display = roundLabel ? '' : 'none';
        badgeEl.textContent = roundLabel || '';

        const cb = document.getElementById('lockCheckbox');
        cb.checked = false;
        cb.disabled = amSpectator;
        cb.closest('.checkbox-wrap').style.display = amSpectator ? 'none' : '';

        document.getElementById('loadingCoins').style.display = amSpectator ? 'none' : '';
        if (!amSpectator) {
          isChecked = false;
          coinStates = [true, true, true];
          renderLoadingCoins();
        }

        document.getElementById('spectatorBanner').style.display = amSpectator ? '' : 'none';
        document.getElementById('loadingHint').style.display = amSpectator ? 'none' : '';

        const total = players.filter(p => !p.isSpectator).length;
        document.getElementById('checkCount').textContent = `0 / ${total} bereit`;
        const list = document.getElementById('checkList');
        list.innerHTML = '';
        players.forEach(p => {
          const li = document.createElement('li');
          const poopMark = p.id === lastLoserId ? ' 💩' : '';
          if (p.isSpectator) {
            li.classList.add('guessed-correct');
            const badge = p.guessedCorrect ? '✓ Richtig geraten' : 'Wartet in Lobby';
            li.innerHTML = `${p.name}${poopMark}${p.id === myId ? ' (du)' : ''}<span class="badge">${badge}</span>`;
          } else {
            li.style.opacity = '0.4';
            li.innerHTML = `${p.name}${poopMark}${p.id === myId ? ' (du)' : ''}<span class="badge">...</span>`;
          }
          list.appendChild(li);
        });
        show('screen-loading');
      }

      if (phase === 'guessing') {
        turnOrderData = turnOrder || [];
        renderTurnOrder(null);
        document.getElementById('guessInput').value = '';
        document.getElementById('guessRow').style.display = 'none';
        document.getElementById('guessBtnWrap').style.display = amSpectator ? 'none' : '';
        document.getElementById('guessingCoins').style.display = amSpectator ? 'none' : '';
        if (!amSpectator) {
          document.querySelectorAll('#guessingCoins .coin-wrapper').forEach((w, i) => {
            w.classList.toggle('off', !coinStates[i]);
          });
        }
        // Rundenanzeige
        const gBadge = document.getElementById('roundBadgeGuessing');
        if (roundMode) {
          gBadge.style.display = '';
          gBadge.textContent = currentRound === 'final' ? 'ENDSPIEL' : `RUNDE ${currentRound} VON 2`;
        } else {
          gBadge.style.display = 'none';
        }
        show('screen-guessing');
      }
    });

    // ── Checkbox state ─────────────────────────────────────
    socket.on('game:checkUpdate', ({ players }) => {
      const checked = players.filter(p => !p.isSpectator && p.isChecked).length;
      const total   = players.filter(p => !p.isSpectator).length;
      document.getElementById('checkCount').textContent = `${checked} / ${total} bereit`;

      const list = document.getElementById('checkList');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        if (p.isSpectator) {
          li.classList.add('guessed-correct');
          const badge = p.guessedCorrect ? '✓ Richtig geraten' : 'Wartet in Lobby';
          li.innerHTML = `${p.name}${p.id === myId ? ' (du)' : ''}<span class="badge">${badge}</span>`;
        } else {
          if (!p.isChecked) li.style.opacity = '0.4';
          li.innerHTML = `${p.name}${p.id === myId ? ' (du)' : ''}<span class="badge">${p.isChecked ? '✓' : '...'}</span>`;
        }
        list.appendChild(li);
      });
    });

    function onCheckboxChange() {
      if (amSpectator) return;
      const cb = document.getElementById('lockCheckbox');
      if (!cb.checked) return;

      sounds.coin();
      // Lock coins and checkbox
      isChecked = true;
      cb.disabled = true;
      document.querySelectorAll('#loadingCoins .coin-wrapper').forEach(w => w.style.cursor = 'default');

      socket.emit('player:check', { coins: coinStates.filter(Boolean).length });
    }

    // ── Coin UI ────────────────────────────────────────────
    function toggleCoin(i) {
      if (isChecked || amSpectator) return;
      coinStates[i] = !coinStates[i];
      renderLoadingCoins();
    }

    function renderLoadingCoins() {
      document.querySelectorAll('#loadingCoins .coin-wrapper').forEach((w, i) => {
        w.classList.toggle('off', !coinStates[i]);
      });
    }

    // ── Guessing ───────────────────────────────────────────
    socket.on('game:turnStart', ({ playerId, playerName, forbiddenNumber: fn }) => {
      forbiddenNumber = fn ?? null;
      const isMe = playerId === myId;
      document.getElementById('whoseTurn').innerHTML = isMe
        ? '<span>Du bist dran!</span>'
        : `Dran: <span>${playerName}</span>`;

      const showInput = isMe && !amSpectator;
      document.getElementById('guessRow').style.display = showInput ? 'flex' : 'none';
      document.getElementById('guessInput').disabled = !showInput;
      document.getElementById('guessDown').disabled = !showInput;
      document.getElementById('guessUp').disabled = !showInput;
      document.getElementById('guessBtnWrap').style.display = showInput ? '' : 'none';
      document.getElementById('guessCheckbox').disabled = !showInput;
      document.getElementById('guessCheckbox').checked = false;
      if (showInput) { document.getElementById('guessInput').value = ''; document.getElementById('guessInput').focus(); }

      document.getElementById('guessInput').style.borderBottomColor = '';

      renderTurnOrder(playerId);
    });

    socket.on('game:guessSubmitted', ({ playerId, guess }) => {
      turnOrderData = turnOrderData.map(p => p.id === playerId ? { ...p, done: true, guess } : p);
      renderTurnOrder(null);
    });

    function onGuessCheckboxChange() {
      const cb = document.getElementById('guessCheckbox');
      if (!cb.checked) return;
      submitGuess();
    }

    function submitGuess() {
      const val = parseInt(document.getElementById('guessInput').value);
      if (isNaN(val)) { document.getElementById('guessCheckbox').checked = false; return; }
      if (forbiddenNumber !== null && val === forbiddenNumber) { document.getElementById('guessCheckbox').checked = false; return; }
      sounds.coin();
      socket.emit('player:guess', { number: val });
      document.getElementById('guessInput').disabled = true;
      document.getElementById('guessDown').disabled = true;
      document.getElementById('guessUp').disabled = true;
      document.getElementById('guessCheckbox').disabled = true;
    }

    function adjustGuess(dir) {
      const input = document.getElementById('guessInput');
      let val = (parseInt(input.value) || 0) + dir;
      if (val < 0) val = 0;
      input.value = val;
      dir > 0 ? play(1100, 'sine', 0.1, 0.15, 1400) : play(500, 'sine', 0.1, 0.15, 300);
      checkForbidden(input);
    }

    document.getElementById('guessInput').addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') adjustGuess(1);
      else if (e.key === 'ArrowDown') adjustGuess(-1);
    });

    document.getElementById('guessInput').addEventListener('input', e => {
      checkForbidden(e.target);
    });

    function checkForbidden(input) {
      const val = parseInt(input.value);
      const isForbidden = forbiddenNumber !== null && val === forbiddenNumber;
      input.style.borderBottomColor = isForbidden ? '#c0392b' : '';
      document.getElementById('guessCheckbox').disabled = isForbidden || input.disabled;
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !document.getElementById('guessCheckbox').disabled) submitGuess();
    });

    function renderTurnOrder(currentId) {
      const list = document.getElementById('turnOrder');
      list.innerHTML = '';
      turnOrderData.forEach(p => {
        const li = document.createElement('li');
        if (p.id === currentId) li.classList.add('current-turn');
        else if (!p.done) li.style.opacity = '0.4';
        const badge = p.done ? `<span class="badge">${p.guess}</span>` : '';
        li.innerHTML = `${p.name}${p.id === myId ? ' (du)' : ''}${badge}`;
        list.appendChild(li);
      });
    }

    // ── Reveal ─────────────────────────────────────────────
    socket.on('game:reveal', ({ coinsPerPlayer, totalCoins, correctGuessers, loserIds, remaining }) => {
      show('screen-reveal');
      document.getElementById('totalCoins').textContent = '0';

      // Build flat coin grid grouped by player
      const grid = document.getElementById('revealCoinsGrid');
      grid.innerHTML = '';
      const entries = Object.entries(coinsPerPlayer).filter(([, d]) => !d.isSpectator);
      const playerCoinEls = []; // array of arrays, one per player

      entries.forEach(([, data]) => {
        const group = [];
        for (let i = 0; i < data.coins; i++) {
          const coin = document.createElement('div');
          coin.className = 'reveal-coin';
          coin.innerHTML = '<img src="coin.png" alt="coin">';
          grid.appendChild(coin);
          group.push(coin);
        }
        playerCoinEls.push(group);
      });

      // Render turn order table (no gray yet)
      const revealList = document.getElementById('revealTurnOrder');
      revealList.innerHTML = '';
      turnOrderData.forEach(p => {
        const li = document.createElement('li');
        li.dataset.id = p.id;
        li.innerHTML = `${p.name}${p.id === myId ? ' (du)' : ''}<span class="badge">${p.guess}</span>`;
        revealList.appendChild(li);
      });

      // Animate coins player by player, 1s pause between players
      const counterEl = document.getElementById('totalCoins');
      const labelEl = document.querySelector('.reveal-total-label');
      let delay = 1100;
      let counter = 0;
      playerCoinEls.forEach((group, pi) => {
        if (pi > 0) delay += 1000;
        const playerName = entries[pi][1].name;
        // Show player name at start of their group
        setTimeout(() => {
          labelEl.textContent = playerName;
          labelEl.style.color = '#ff8c00';
        }, delay);
        group.forEach((coin, ci) => {
          const isLast = ci === group.length - 1;
          setTimeout(() => {
            coin.classList.add('visible');
            sounds.coin();
            counter++;
            if (isLast) {
              counterEl.textContent = counter;
              counterEl.classList.remove('counter-bump');
              void counterEl.offsetWidth;
              counterEl.classList.add('counter-bump');
            }
          }, delay);
          delay += 500;
        });
      });
      // Reset label to GESAMT + grau korrekte Spieler nach Animation
      setTimeout(() => {
        labelEl.textContent = 'GESAMT';
        labelEl.style.color = '';
        sounds.total();
        revealList.querySelectorAll('li').forEach(li => {
          if (correctGuessers.includes(li.dataset.id)) {
            li.classList.add('guessed-correct');
          }
        });
      }, delay);
      revealAnimationEndsAt = Date.now() + delay;

      // Show correct guessers message
      const msgEl = document.getElementById('revealCorrectMsg');
      msgEl.style.display = 'none';
      msgEl.style.opacity = '0';
      setTimeout(() => {
        const names = correctGuessers.map(id => coinsPerPlayer[id]?.name).filter(Boolean);
        if (names.length > 0) {
          msgEl.textContent = names.join(', ') + (names.length === 1 ? ' hat richtig geraten!' : ' haben richtig geraten!');
          sounds.correct();
        } else {
          msgEl.textContent = 'Niemand hat richtig geraten.';
        }
        msgEl.style.display = '';
        void msgEl.offsetWidth;
        msgEl.style.opacity = '1';
      }, delay + 200);

    });

    // ── Finished ───────────────────────────────────────────
    socket.on('game:finished', ({ loserName, players: finishedPlayers }) => {
      const waitMs = Math.max(2000, revealAnimationEndsAt - Date.now() + 2000);
      setTimeout(() => {
        show('screen-finished');
        sounds.loser();
        document.getElementById('loserName').textContent = loserName;
        document.getElementById('restartCheckbox').checked = false;
        document.getElementById('restartCheckbox').disabled = false;

        const list = document.getElementById('finishedPlayerList');
        list.innerHTML = '';
        (finishedPlayers || []).forEach(p => {
          const li = document.createElement('li');
          li.innerHTML = `${p.name}${p.id === myId ? ' (du)' : ''}${p.drink ? `<span class="badge">${p.drink}</span>` : ''}`;
          if (p.name === loserName) li.style.color = '#ff8c00';
          list.appendChild(li);
        });
      }, waitMs);
    });

    socket.on('game:backToLobby', () => {
      show('screen-lobby');
    });

    function onRestartCheckbox() {
      const cb = document.getElementById('restartCheckbox');
      if (!cb.checked) return;
      cb.disabled = true;
      socket.emit('game:restart');
    }

  </script>
</body>
</html>
